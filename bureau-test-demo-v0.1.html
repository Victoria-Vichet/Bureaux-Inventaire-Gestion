<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bureau Test — structure de la page : app-css (styles Inventaire) · bx-css (styles Mon bureau) · app-body (gabarit Inventaire) · plan-img (image du plan) · app-state (état initial) · app-js (Inventaire) · bx-js (Mon bureau + Admin, voir son sommaire). Données : base partagée de l'artefact. -->
<title>Bureau Test</title>
<style id="app-css">
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#667085;--line:#e3e6eb;--accent:#1f4fd1;--accent-soft:#e8eefc;--danger:#c0362c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;white-space:nowrap}
button:hover{border-color:#c4cad4;background:#fafbfc}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#1a44b8}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;width:100%}
input[type=number]{padding:4px 6px}
textarea{resize:vertical;min-height:54px}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650}
header .sub{color:var(--muted);font-size:12.5px}
header .sp{flex:1}
.status{font-size:12.5px;color:var(--muted)}
.status.dirty{color:#b45309}
.kpis{display:flex;gap:8px;padding:12px 18px;overflow-x:auto;align-items:stretch}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:78px;white-space:nowrap;flex:none}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.kpi.room{background:#f7f5ff}
.kgap{width:1px;background:var(--line);flex:none;margin:0 4px}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 12px;color:var(--muted)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;background:none}
.view{display:none}
.view.on{display:block}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 18px 4px;flex-wrap:wrap}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.toolbar label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:none;border-radius:0;border-right:1px solid var(--line);padding:6px 12px}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.lgroup{display:none;gap:8px;align-items:center;flex-wrap:wrap}
.lgroup.on{display:flex}
.planwrap{display:flex;gap:14px;padding:6px 18px 18px;align-items:flex-start}
.planbox{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 250px);position:relative}
#plan{display:block;touch-action:none;user-select:none}
#plan.mode-add,#plan.mode-addStore,#plan.mode-cluster,#plan.mode-drawRoom,#plan.mode-drawWall,#plan.mode-drawZoneRect,#plan.mode-drawPoly{cursor:crosshair}
.inactive{pointer-events:none}
.desk rect.b{stroke-width:1.2;cursor:move}
.desk text,.room text{pointer-events:none;text-anchor:middle;dominant-baseline:central}
.desk text{font-size:8.5px;font-weight:600;fill:#0d1424}
.desk.sel rect.b{stroke:#e11d48!important;stroke-width:2.6}
.desk.dim{opacity:.18}
.room rect.b{cursor:move}
.room.sel rect.b{stroke:#e11d48!important;stroke-width:3}
.room text.n{font-weight:650;fill:#1d2330}
.room text.c{fill:#475569}
.wall .hit{stroke:transparent;stroke-width:12;cursor:move;stroke-linecap:round}
.wall.sel .vis{stroke:#e11d48!important}
.layer-off{opacity:.55}
.zone .b{cursor:move}
.zone text{pointer-events:none;text-anchor:middle;dominant-baseline:central}
.zone.sel .b{stroke:#e11d48!important;stroke-width:2.6;stroke-dasharray:none!important}
.vh{fill:#fff;stroke:#1f4fd1;stroke-width:1.6;cursor:move}
.mh{fill:#1f4fd1;fill-opacity:.35;stroke:#1f4fd1;stroke-width:1;cursor:copy}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.swatches button{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.swatches button.on{box-shadow:0 0 0 2px #1d2330}
.statgrid{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;margin-top:4px}
.statgrid b{font-variant-numeric:tabular-nums;text-align:right}
.ro{padding:6px 8px;background:#f6f7f9;border:1px solid var(--line);border-radius:6px;font-size:13px}
.ro i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rh{fill:#fff;stroke:#e11d48;stroke-width:1.6;cursor:grab}
.ch{fill:#fff;stroke:#1f4fd1;stroke-width:1.6;cursor:nwse-resize}
.ep{fill:#fff;stroke:#e11d48;stroke-width:1.8;cursor:crosshair}
.rh-line{stroke:#e11d48;stroke-width:1.2;stroke-dasharray:2 2;pointer-events:none;fill:none}
.inspector{width:320px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 250px);overflow:auto}
.inspector h3{margin:0 0 4px;font-size:15px}
.inspector .hint{color:var(--muted);font-size:12.5px}
kbd{background:#f1f3f6;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11.5px}
.eqgrid{display:grid;grid-template-columns:1fr 64px;gap:4px 8px;align-items:center;margin-top:4px}
.eqgrid span{font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.rotrow{display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap}
.rotrow input{width:62px}
.rotrow button{padding:5px 8px}
.toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.toggle button{flex:1;border:none;border-radius:0;padding:6px 8px}
.toggle button+button{border-left:1px solid var(--line)}
.toggle button.on{background:#0f766e;color:#fff;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:2px 18px 4px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.hatch{background:repeating-linear-gradient(45deg,#fff 0 2px,#64748b 2px 3.5px);border:1px solid #64748b}
.subtabs{display:flex;gap:6px;padding:10px 18px 0}
.tablebox{margin:0 18px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 290px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#f8f9fb;font-weight:600;cursor:pointer;z-index:1;font-size:12.5px}
th.num,td.num{text-align:right}
td input[type=number]{width:58px;text-align:right}
td input[type=text]{min-width:120px}
td select{min-width:150px}
tfoot td{position:sticky;bottom:0;background:#f3f5f9;font-weight:650}
tr.selrow td{background:#fff5f7}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:underline}
.settings{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px}
.card p{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.eqedit{display:grid;grid-template-columns:1fr 70px auto auto;gap:6px;align-items:center;margin-bottom:6px}
.banner{margin:10px 18px 0;padding:9px 12px;border-radius:8px;background:#fff7e6;border:1px solid #f5d38a;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .sp{flex:1}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.35);display:none;align-items:center;justify-content:center;z-index:20}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:12px;padding:18px;width:min(380px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin:0 0 6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.menu{position:relative;display:inline-block}
.menu .items{display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);min-width:240px;z-index:15;padding:4px}
.menu.open .items{display:block}
.menu .items button{display:block;width:100%;text-align:left;border:none;border-radius:5px;padding:7px 10px}
.menu .items button:hover{background:var(--accent-soft)}
.invhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 18px 0}
.invhead .t b{font-size:15px}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.prog .bar{width:120px;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:#16a34a;width:0}
.invwrap{display:flex;gap:14px;padding:6px 18px 18px;align-items:flex-start}
.invcard{flex:1.3;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.invcard h2{margin:0;font-size:24px}
.invtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{font-size:12px;padding:4px 9px;border-radius:999px;background:#fff4e5;color:#9a5b00;white-space:nowrap}
.badge.ok{background:#e7f6ec;color:#147a3d}
.mini{width:100%;height:190px;border:1px solid var(--line);border-radius:8px;background:#f4f7fc;margin-top:10px;display:block}
.steps{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;margin-top:6px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;font-size:20px;padding:0;line-height:1}
.stepper output{min-width:30px;text-align:center;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.invbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.invbtns .primary{flex:1;min-width:200px;padding:11px;font-size:15px}
.invlist{flex:1;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 260px);overflow:auto}
.ir{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.ir:hover{background:#fafbfc}
.ir.cur{background:var(--accent-soft)}
.ir .st{width:18px;text-align:center;color:#c2c8d2}
.ir .st.ok{color:#16a34a;font-weight:700}
.ir .loc{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckl{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 0 22px;font-size:13px}
.lbopt{display:block;font-size:13.5px;margin:4px 0}
.loadov{position:fixed;inset:0;background:rgba(246,247,249,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:40;font-size:15px;color:#475569}
.loadov.off{display:none}
.spin{width:28px;height:28px;border:3px solid #cbd5e1;border-top-color:#1f4fd1;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.status.ok{color:#147a3d}
.store rect.b{cursor:move}
.store.sel rect.b{stroke:#e11d48!important;stroke-width:2.2}
.store text{pointer-events:none;text-anchor:middle;dominant-baseline:central;font-size:6px;font-weight:700;fill:#4a3a22}
.drw{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 6px;align-items:center;margin-top:4px;font-size:13px}
.drw span{color:var(--muted);white-space:nowrap}
.toggle.ergo button.on{background:#7c3aed}
@media (max-width:900px){.invwrap{flex-direction:column}.invcard{max-width:none;width:100%}.invlist{width:100%;max-height:none}}
@media (max-width:900px){.planwrap{flex-direction:column}.inspector{width:100%;max-height:none}.planbox{max-height:none;width:100%}}
</style>
<style id="bx-css">/* ============================================================================
   Bureau Test — styles du module « Mon bureau » (préfixe #bx / .bx-)
   Sections : coquille · cartes et boutons · plan · fiche poste · navigation ·
              formulaires et tableaux · admin (inventaire, matériel, historique)
   ============================================================================ */
#bx{position:fixed;inset:0;z-index:2147483000;background:#f1f5f9;color:#0f172a;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
#bx[hidden],#bx [hidden],#bxBack[hidden]{display:none!important}
#bx *{box-sizing:border-box}
#bx button{font:inherit;cursor:pointer}
#bx .bx-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #e2e8f0}
#bx .bx-top b{font-size:18px;display:block}.bx-top small{color:#64748b}
#bx .bx-chip{border:1px solid #e2e8f0;background:#fff;border-radius:99px;padding:6px 12px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bx .bx-main{flex:1;overflow:auto;padding:14px 14px 24px}
#bx .bx-wrap{max-width:760px;margin:0 auto}
#bx .bx-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px}
#bx .bx-card h3{margin:0 0 8px;font-size:13px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
#bx .bx-big{font-size:24px;font-weight:700;margin:2px 0 4px}
#bx .bx-pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
#bx .bx-btn{display:block;width:100%;margin-top:8px;padding:11px 14px;border-radius:10px;border:0;background:#2563eb;color:#fff;font-weight:600;text-align:center}
#bx .bx-btn.sec{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
#bx .bx-btn.dng{background:#fff;color:#b91c1c;border:1px solid #fecaca}
#bx .bx-btn.sm{display:inline-block;width:auto;margin:0;padding:6px 10px;font-size:13px}
#bx .bx-btn:disabled{opacity:.5;cursor:default}
#bx .bx-row{display:flex;gap:8px}.bx-row>*{flex:1}
#bx .bx-li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #e2e8f0}.bx-li:first-of-type{border-top:0}
#bx .bx-mut{color:#64748b}.bx-sm{font-size:13px}
#bx .bx-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;align-items:stretch}
#bx .bx-dchip{flex:0 0 auto;padding:6px 10px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;font-size:13px;text-align:center;line-height:1.2}
#bx .bx-dchip.on{background:#0f172a;color:#fff;border-color:#0f172a}
#bx .bx-dchip input{border:0;font:inherit;background:transparent;width:130px}
#bx .bx-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#64748b;margin:4px 0 8px}
#bx .bx-legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
#bx .bx-planbox{position:relative;overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;max-height:62vh;touch-action:pan-x pan-y}
#bx .bx-planbox svg{display:block;height:auto}
#bx .bx-planbox g.d{cursor:pointer}
#bx .bx-zoom{display:flex;gap:6px;justify-content:flex-end;margin:6px 0}
#bx .bx-zoom button{width:38px;height:34px;border-radius:9px;border:1px solid #cbd5e1;background:#fff;font-size:18px}
#bx .bx-sheet{position:absolute;left:0;right:0;bottom:58px;max-width:760px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.18);padding:12px 16px 16px;max-height:70vh;overflow:auto}
#bx .bx-sheet .x{float:right;border:0;background:none;font-size:22px;line-height:1;color:#64748b}
#bx .bx-eq{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.bx-eq span{background:#f1f5f9;border-radius:7px;padding:3px 8px;font-size:13px}
#bx .bx-nav{display:flex;background:#fff;border-top:1px solid #e2e8f0;height:58px}
#bx .bx-nav button{flex:1;border:0;background:none;color:#64748b;font-size:11px;padding:6px 0}
#bx .bx-nav button i{display:block;font-style:normal;font-size:19px;line-height:1.2}
#bx .bx-nav button.on{color:#2563eb;font-weight:600}
#bx .bx-toast{position:absolute;left:50%;top:72px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
#bx .bx-toast.on{opacity:1}
#bx .bx-in{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff}
#bx .bx-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#bx .bx-form label{font-size:12px;color:#64748b;display:block}
#bx .bx-tbl{width:100%;border-collapse:collapse;font-size:14px}
#bx .bx-tbl th{text-align:left;color:#64748b;font-size:12px;font-weight:600;padding:6px 4px;border-bottom:1px solid #e2e8f0}
#bx .bx-tbl td{padding:7px 4px;border-bottom:1px solid #e2e8f0;vertical-align:middle}
#bx .bx-name{display:block;width:100%;text-align:left;padding:12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;margin-top:6px}
#bx .bx-warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
#bxBack{position:fixed;left:14px;bottom:14px;z-index:2147483000;padding:10px 14px;border-radius:99px;border:0;background:#2563eb;color:#fff;font:600 14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
@media(min-width:900px){#bx .bx-sheet{bottom:70px;border-radius:18px}}
#bx .bx-nav button i{position:relative;width:26px;margin:0 auto}
#bx .bx-badge{position:absolute;top:-4px;left:18px;background:#dc2626;color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px;font-style:normal;line-height:1.4}
#bx .bx-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#bx .bx-day{min-height:48px;border:1px solid #e2e8f0;border-radius:8px;padding:3px 4px;font-size:13px;display:flex;flex-direction:column;justify-content:space-between}
#bx .bx-day small{font-size:10px;font-weight:700}
#bx .bx-day.tdy{outline:2px solid #0f172a}
#bx textarea.bx-in{margin-top:8px;resize:vertical}
#bx #bxRole{max-width:none;flex:0 0 auto}
#bx .bx-top>div:first-child{min-width:0;flex:1 1 auto}
#bx .bx-chk{display:flex;align-items:center;gap:6px;font-size:14px;color:#0f172a;padding:9px 0}
#bx .bx-chk input{width:18px;height:18px}
#bx .bx-eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px}
#bx .bx-eqrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
#bx .bx-step{display:flex;align-items:center;border:1px solid #cbd5e1;border-radius:9px;overflow:hidden}
#bx .bx-step button{width:34px;height:34px;border:0;background:#f1f5f9;font-size:18px;padding:0;border-radius:0}
#bx .bx-step input{width:42px;height:34px;border:0;text-align:center;font:inherit;-moz-appearance:textfield}
#bx .bx-step input::-webkit-inner-spin-button{-webkit-appearance:none}
#bx .bx-bar{display:grid;grid-template-columns:90px 1fr 64px;align-items:center;gap:8px;font-size:13px;margin-top:8px}
#bx .bx-bar>div{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}
#bx .bx-bar i{display:block;height:100%;background:#16a34a;border-radius:99px}
#bx .bx-bar b{text-align:right}
</style>
</head>
<body>
<template id="app-body">
<header>
  <div>
    <h1 id="ttl">Inventaire des postes</h1>
    <div class="sub" id="subttl"></div>
  </div>
  <div class="sp"></div>
  <span class="status" id="status"></span>
  <button id="btnUndo" title="Annuler (Ctrl+Z)">↶ Annuler</button>
  <div class="menu" id="menuExport">
    <button id="btnExport">Exporter ▾</button>
    <div class="items">
      <button data-exp="xlsx">Excel (.xlsx) – postes, salles, synthèse</button>
      <button data-exp="csv">CSV des postes (.csv)</button>
      <button data-exp="json">Sauvegarde complète (.json)</button>
      <button data-exp="copy">Copier le tableau des postes</button>
      <button data-exp="labels">Étiquettes à imprimer (PDF)…</button>
      <button data-exp="sheet">Fiche d'inventaire papier (PDF)</button>
      <button data-exp="import">Importer une sauvegarde .json…</button>
    </div>
  </div>
  <span class="status" id="syncChip" title="Les modifications sont enregistrées automatiquement et partagées en direct"></span>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</header>
<div id="bannerBox"></div>
<div class="kpis" id="kpis"></div>
<div class="tabs">
  <button data-tab="plan" class="on">Plan</button>
  <button data-tab="inv">Inventaire</button>
  <button data-tab="table">Tableaux</button>
  <button data-tab="settings">Paramètres</button>
</div>

<section class="view on" id="view-plan">
  <div class="toolbar">
    <span style="font-size:12.5px;color:var(--muted)">Modifier :</span>
    <div class="seg" id="layerSeg">
      <button data-layer="desk" class="on">Postes</button>
      <button data-layer="storage">Rangements</button>
      <button data-layer="zone">Zones</button>
      <button data-layer="room">Salles</button>
      <button data-layer="wall">Murs &amp; cloisons</button>
    </div>
    <span class="sep"></span>
    <button id="mSelect" class="on" title="Sélectionner / déplacer (V)">Sélection</button>
    <div class="lgroup on" data-for="desk">
      <button id="mAdd" title="Cliquez sur le plan pour poser un poste (A)">+ Poste</button>
      <button id="mCluster" title="Créer un îlot de plusieurs postes">+ Îlot</button>
      <label title="Angle des nouveaux postes (R pendant le placement pour tourner de 90°)">Angle <input type="number" id="addRot" value="0" step="15" style="width:62px">°</label>
      <label>Nouveau poste <select id="addSD" style="width:auto"><option value="0">Fixe</option><option value="1">Assis-debout</option></select></label>
    </div>
    <div class="lgroup" data-for="storage">
      <button id="mStore" title="Cliquez sur le plan pour poser un rangement (ex. caisson IKEA Alex entre deux bureaux)">+ Rangement</button>
      <label>Modèle <select id="addStoreModel" style="width:auto"></select></label>
    </div>
    <div class="lgroup" data-for="zone">
      <button id="mZoneRect" title="Cliquer-glisser pour dessiner une zone rectangulaire">+ Zone rectangle</button>
      <button id="mZonePoly" title="Cliquer chaque coin, puis double-clic ou Entrée pour fermer">+ Zone forme libre</button>
    </div>
    <div class="lgroup" data-for="room">
      <button id="mRoom" title="Cliquer-glisser sur le plan pour dessiner une salle">+ Salle</button>
      <label>Type <select id="addRoomType" style="width:auto"></select></label>
    </div>
    <div class="lgroup" data-for="wall">
      <button id="mWall" title="Cliquer-glisser pour tracer un segment (W)">Tracer</button>
      <label>Type <select id="addWallKind" style="width:auto"><option value="mur">Mur</option><option value="cloison" selected>Cloison</option><option value="vitree">Cloison vitrée</option><option value="porte">Porte / ouverture</option></select></label>
    </div>
  </div>
  <div class="toolbar">
    <button id="zOut" title="Dézoomer">−</button>
    <button id="zFit" title="Ajuster">Ajuster</button>
    <button id="zIn" title="Zoomer">+</button>
    <span class="sep"></span>
    <label title="Plan d'origine en arrière-plan, utile comme calque de référence">Plan d'origine <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.3"></label>
    <label><input type="checkbox" id="snap" checked> Aimanter</label>
    <label title="Afficher, estomper ou masquer les zones pour mieux lire le plan">Zones <select id="zoneVis" style="width:auto"><option value="1">Visibles</option><option value="0.35">Estompées</option><option value="0">Masquées</option></select></label>
    <span class="sep"></span>
    <div class="lgroup on" data-for="desk">
      <label>Couleur <select id="colorBy" style="width:auto"><option value="statut">Statut</option><option value="hauteur">Fixe / assis-debout</option></select></label>
      <label>Zone <select id="zoneFilterPlan" style="width:auto"><option value="">Toutes</option></select></label>
      <button id="btnRenum" title="Renumérote P-001, P-002… zone par zone, puis de haut en bas et de gauche à droite">Renuméroter</button>
    </div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="planwrap">
    <div class="planbox" id="planbox">
      <svg id="plan" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="2.4"/></pattern>
          <pattern id="coreHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2"/></pattern>
        </defs>
        <rect id="bg" x="0" y="0" fill="#f4f7fc"></rect>
        <image id="planImg" x="0" y="0" preserveAspectRatio="none"></image>
        <g id="zoneLayer"></g>
        <g id="staticLayer" class="inactive"></g>
        <g id="roomLayer"></g>
        <g id="wallLayer"></g>
        <g id="storageLayer"></g>
        <g id="deskLayer"></g>
        <g id="handleLayer"></g>
        <rect id="ghost" fill="rgba(31,79,209,.22)" stroke="#1f4fd1" stroke-dasharray="3 2" visibility="hidden" class="inactive"></rect>
        <g id="ghostG" class="inactive"></g>
        <polyline id="ghostPoly" fill="rgba(31,79,209,.10)" stroke="#1f4fd1" stroke-width="1.5" stroke-dasharray="4 3" visibility="hidden" class="inactive"></polyline>
        <line id="ghostLine" stroke="#1f4fd1" stroke-width="4" stroke-dasharray="6 3" visibility="hidden" class="inactive"></line>
        <rect id="band" fill="rgba(31,79,209,.08)" stroke="#1f4fd1" stroke-dasharray="4 3" visibility="hidden" class="inactive"></rect>
      </svg>
    </div>
    <aside class="inspector" id="inspector"></aside>
  </div>
</section>

<section class="view" id="view-inv">
  <div class="invhead">
    <div class="t"><b id="invTitle"></b><div style="color:var(--muted);font-size:12.5px" id="invSub"></div></div>
    <div class="prog">Postes <div class="bar"><i id="invBarD"></i></div><span id="invPctD"></span></div>
    <div class="prog">Rangements <div class="bar"><i id="invBarS"></i></div><span id="invPctS"></span></div>
    <div class="prog">Salles <div class="bar"><i id="invBarR"></i></div><span id="invPctR"></span></div>
    <label style="font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center">Inventorié par <input id="invWho" type="text" style="width:140px" placeholder="Votre nom"></label>
    <button id="btnLabels">Étiquettes à imprimer…</button>
    <button id="btnSheet">Fiche papier (PDF)</button>
    <button id="btnCampaign" class="danger">Nouvelle campagne…</button>
  </div>
  <div class="toolbar">
    <div class="seg" id="invSeg"><button data-k="desk" class="on">Postes</button><button data-k="storage">Rangements</button><button data-k="room">Salles</button></div>
    <label>Zone <select id="invZone" style="width:auto"><option value="">Toutes</option></select></label>
    <label><input type="checkbox" id="invTodo"> À faire seulement</label>
    <span class="status" id="invCount"></span>
  </div>
  <div class="invwrap">
    <div class="invcard" id="invCard"></div>
    <div class="invlist" id="invList"></div>
  </div>
</section>

<section class="view" id="view-table">
  <div class="subtabs"><div class="seg" id="tblSeg"><button data-t="desk" class="on">Postes</button><button data-t="storage">Rangements</button><button data-t="zone">Zones</button><button data-t="room">Salles</button></div></div>
  <div class="toolbar">
    <input type="text" id="q" placeholder="Rechercher…" style="max-width:280px">
    <label class="tf-desk">Zone <select id="zoneFilter" style="width:auto"><option value="">Toutes</option></select></label>
    <label class="tf-desk">Statut <select id="statFilter" style="width:auto"><option value="">Tous</option></select></label>
    <label class="tf-desk">Adapté <select id="ergoFilter" style="width:auto"><option value="">Tous</option><option value="1">Oui</option><option value="0">Non</option></select></label>
    <label class="tf-desk">Bureau <select id="sdFilter" style="width:auto"><option value="">Tous</option><option value="1">Assis-debout</option><option value="0">Fixe</option></select></label>
    <label class="tf-zone" style="display:none">Type <select id="zoneTypeFilter" style="width:auto"><option value="">Tous</option></select></label>
    <label class="tf-room" style="display:none">Type <select id="roomTypeFilter" style="width:auto"><option value="">Tous</option></select></label>
    <span class="status" id="tableCount"></span>
  </div>
  <div class="tablebox"><table id="tbl"></table></div>
</section>

<section class="view" id="view-settings">
  <div class="settings">
    <div class="card">
      <h3>Équipements des postes</h3>
      <p>Chaque ligne devient une colonne du tableau des postes. La quantité par défaut s'applique aux nouveaux postes.</p>
      <div id="eqEdit" data-set="desk"></div>
      <div class="row"><button data-eqadd="desk">+ Ajouter un équipement</button></div>
    </div>
    <div class="card">
      <h3>Équipements des salles</h3>
      <p>Chaque ligne devient une colonne du tableau des salles.</p>
      <div id="reqEdit" data-set="room"></div>
      <div class="row"><button data-eqadd="room">+ Ajouter un équipement</button></div>
    </div>
    <div class="card">
      <h3>Types de poste</h3>
      <p>Une valeur par ligne. (Fixe / assis-debout est un champ à part.)</p>
      <textarea id="typesEdit" rows="5"></textarea>
      <div class="row"><button id="typesSave">Appliquer</button></div>
      <h3 style="margin-top:16px">Types de zone</h3>
      <p>Une valeur par ligne.</p>
      <textarea id="zoneTypesEdit" rows="6"></textarea>
      <div class="row"><button id="zoneTypesSave">Appliquer</button></div>
      <h3 style="margin-top:16px">Types de salle</h3>
      <p>Une valeur par ligne.</p>
      <textarea id="roomTypesEdit" rows="7"></textarea>
      <div class="row"><button id="roomTypesSave">Appliquer</button></div>
    </div>
    <div class="card">
      <h3>Document</h3>
      <label class="f">Titre</label><input type="text" id="setTitle">
      <label class="f">Zone couverte</label><input type="text" id="setZone">
      <label class="f">Adresse de la page (pour les QR codes des étiquettes)</label><input type="text" id="setUrl">
      <div class="row"><button id="docSave">Appliquer</button></div>
      <p style="margin-top:14px">Postes par zone (calculé selon la position) :</p>
      <div id="zoneList" style="font-size:12.5px;color:var(--muted)"></div>
      <h3 style="margin-top:16px">Remise à zéro</h3>
      <p>Ctrl+Z permet d'annuler tant que la page est ouverte.</p>
      <div class="row"><button class="danger" data-clear="desk">Vider les postes</button><button class="danger" data-clear="zone">Vider les zones</button><button class="danger" data-clear="room">Vider les salles</button><button class="danger" data-clear="wall">Vider les murs</button></div>
    </div>
  </div>
</section>

<div class="modal" id="clusterModal">
  <div class="box">
    <h3>Nouvel îlot</h3>
    <div style="color:var(--muted);font-size:12.5px">Un bloc principal, avec si besoin des postes perpendiculaires en bout d'îlot. Après validation, cliquez sur le plan pour le placer.</div>
    <label class="f">Postes du bloc principal</label>
    <select id="cOrient"><option value="v">Verticaux (26 × 52)</option><option value="h">Horizontaux (52 × 26)</option></select>
    <div class="g2">
      <div><label class="f">Colonnes</label><input type="number" id="cCols" min="1" max="20" value="2"></div>
      <div><label class="f">Rangées</label><input type="number" id="cRows" min="1" max="20" value="3"></div>
    </div>
    <label class="f" id="cCapLbl">Postes horizontaux en bout d'îlot</label>
    <div class="g2">
      <div><label class="f" id="cCap1Lbl" style="margin-top:0">En haut</label><input type="number" id="cCap1" min="0" max="6" value="0"></div>
      <div><label class="f" id="cCap2Lbl" style="margin-top:0">En bas</label><input type="number" id="cCap2" min="0" max="6" value="0"></div>
    </div>
    <label class="f">Aperçu</label>
    <svg id="cPrev" width="100%" height="150" style="background:#f6f7f9;border:1px solid var(--line);border-radius:8px;display:block"></svg>
    <label class="f">Bureaux</label>
    <select id="cSD"><option value="0">Fixes</option><option value="1">Assis-debout</option></select>
    <label class="f">Îlot / groupe (facultatif — la zone est déduite de la position)</label>
    <input type="text" id="cZone" list="zonesDL">
    <div class="row" style="justify-content:flex-end"><button id="cCancel">Annuler</button><button class="primary" id="cOk">Placer sur le plan</button></div>
  </div>
</div>
<div class="modal" id="labelModal">
  <div class="box" style="width:min(480px,94vw);max-height:92vh;overflow:auto">
    <h3>Étiquettes à imprimer</h3>
    <div style="color:var(--muted);font-size:12.5px">PDF au format de planches d'étiquettes autocollantes. Le QR code ouvre directement la fiche d'inventaire dans cette page (pour les personnes qui y ont accès).</div>
    <label class="f">Quoi étiqueter</label>
    <label class="lbopt"><input type="checkbox" id="lbDesk" checked> Postes — 1 étiquette par poste</label>
    <label class="lbopt"><input type="checkbox" id="lbRoom" checked> Salles — 1 étiquette par salle</label>
    <label class="lbopt"><input type="checkbox" id="lbEq"> Équipements des postes — 1 étiquette par unité</label>
    <div class="ckl" id="lbEqTypes"></div>
    <label class="lbopt"><input type="checkbox" id="lbSto"> Rangements — 1 étiquette par meuble</label>
    <label class="lbopt"><input type="checkbox" id="lbDr"> Tiroirs des rangements — 1 étiquette par tiroir</label>
    <label class="lbopt"><input type="checkbox" id="lbReq"> Équipements des salles — 1 étiquette par unité</label>
    <div class="ckl" id="lbReqTypes"></div>
    <label class="f">Pour</label>
    <select id="lbScope"></select>
    <label class="f">Format de planche</label>
    <select id="lbFmt">
      <option value="5160">Avery 5160 / 8160 — 30 par page (2⅝" × 1")</option>
      <option value="5163" selected>Avery 5163 / 8163 — 10 par page (4" × 2")</option>
      <option value="5164">Avery 5164 / 8164 — 6 par page (4" × 3⅓")</option>
      <option value="a4-24">A4 — 24 par page (70 × 37 mm)</option>
    </select>
    <div class="g2">
      <div><label class="f">Commencer à l'étiquette n°</label><input type="number" id="lbStart" value="1" min="1"></div>
      <div><label class="f">QR code</label><select id="lbQR"><option value="1">Oui</option><option value="0">Non</option></select></div>
    </div>
    <label class="lbopt" style="margin-top:8px"><input type="checkbox" id="lbBorder"> Tracer les contours (test sur papier ordinaire)</label>
    <label class="f">Adresse de cette page (lien des QR codes)</label>
    <input type="text" id="lbUrl">
    <div id="lbCount" style="margin-top:10px;font-weight:600"></div>
    <div class="row" style="justify-content:flex-end"><button id="lbCancel">Annuler</button><button class="primary" id="lbGo">Générer le PDF</button></div>
  </div>
</div>
<div class="modal" id="campModal">
  <div class="box">
    <h3>Nouvelle campagne d'inventaire</h3>
    <div style="color:var(--muted);font-size:12.5px">Remet tous les postes et salles à « à faire ». Les quantités, occupants et notes sont conservés.</div>
    <label class="f">Nom de la campagne</label><input type="text" id="campName">
    <div class="row" style="justify-content:flex-end"><button id="campCancel">Annuler</button><button class="primary danger" id="campOk" style="background:#c0362c;border-color:#c0362c">Démarrer</button></div>
  </div>
</div>
<datalist id="zonesDL"></datalist>
<div class="toast" id="toast"></div>
<div class="loadov" id="loadOv"><div class="spin"></div><div id="loadMsg">Chargement des données partagées…</div><button id="goLocal" style="display:none">Continuer sans les données partagées</button></div>
</template>

function snapV(v){return $('snap').checked?Math.round(v/5)*5:Math.round(v*10)/10;}
function norm(a){a=Math.round(a*10)/10%360;return a<0?a+360:a;}
/* ---------- Zones : appartenance calculée selon la position ---------- */
function pip(p,pts){var c=false;for(var i=0,j=pts.length-1;i<pts.length;j=i++){var a=pts[i],b=pts[j];
  if(((a[1]>p.y)!==(b[1]>p.y))&&(p.x<(b[0]-a[0])*(p.y-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function area(pts){var s=0;for(var i=0,j=pts.length-1;i<pts.length;j=i++)s+=(pts[j][0]+pts[i][0])*(pts[j][1]-pts[i][1]);return Math.abs(s/2);}
function zoneAt(p){var best=null,ba=1e12;S.zones.forEach(function(z){if(z.pts.length>2&&pip(p,z.pts)){var a=area(z.pts);if(a<ba){ba=a;best=z;}}});return best;}
function zoneOf(o){return zoneAt(center(o));}
function zoneName(o){var z=zoneOf(o);return z?z.name:"(sans zone)";}
function desksIn(z){return S.desks.filter(function(d){return zoneOf(d)===z;});}
function zones(){var out=S.zones.slice().sort(function(a,b){return a.name.localeCompare(b.name,'fr',{numeric:true});}).map(function(z){return {name:z.name,n:desksIn(z).length,z:z};});
  var nz=S.desks.filter(function(d){return !zoneOf(d);}).length;if(nz)out.push({name:"(sans zone)",n:nz});return out;}
/* ---------- Salles : un poste dont le centre est dans une salle y est rattaché ---------- */
function inRect(p,r){var c=center(r),q=rot2(p,c,-(r.rot||0));return Math.abs(q.x-c.x)<=r.w/2&&Math.abs(q.y-c.y)<=r.h/2;}
function roomOf(d){var best=null,ba=1e12,c=center(d);S.rooms.forEach(function(r){if(inRect(c,r)){var a=r.w*r.h;if(a<ba){ba=a;best=r;}}});return best;}
function desksInRoom(r){return S.desks.filter(function(d){return roomOf(d)===r;});}
function roomName(d){var r=roomOf(d);return r?r.name:"";}
function locLabel(o){var z=zoneOf(o),r=isWall(o)||isZone(o)||o.capacite!==undefined?null:roomOf(o);return [z?z.name:"",r?r.name:""].filter(Boolean).join(" · ")||"Hors zone";}
function ilots(){var m={};S.desks.forEach(function(d){if(d.ilot)m[d.ilot]=1;});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'fr',{numeric:true});});}

/* ---------- Géométrie ---------- */
function isWall(o){return o.x1!==undefined;}
function isZone(o){return o.pts!==undefined;}
function center(o){if(isZone(o)){var b=bbox([o]);return {x:b.cx,y:b.cy};}return isWall(o)?{x:(o.x1+o.x2)/2,y:(o.y1+o.y2)/2}:{x:o.x+o.w/2,y:o.y+o.h/2};}
function corners(o){if(isZone(o))return o.pts.map(function(q){return {x:q[0],y:q[1]};});if(isWall(o))return [{x:o.x1,y:o.y1},{x:o.x2,y:o.y2}];
  var c=center(o),r=(o.rot||0)*Math.PI/180,co=Math.cos(r),si=Math.sin(r),out=[];
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(s){var dx=s[0]*o.w/2,dy=s[1]*o.h/2;out.push({x:c.x+dx*co-dy*si,y:c.y+dx*si+dy*co});});return out;}
function bbox(list){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;list.forEach(function(o){corners(o).forEach(function(p){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});});
  return {x0:x0,y0:y0,x1:x1,y1:y1,cx:(x0+x1)/2,cy:(y0+y1)/2};}
function rot2(p,C,deg){var r=deg*Math.PI/180,co=Math.cos(r),si=Math.sin(r),dx=p.x-C.x,dy=p.y-C.y;return {x:C.x+dx*co-dy*si,y:C.y+dx*si+dy*co};}
function r1(v){return Math.round(v*10)/10;}
function snapshotSel(){var o={};sel.forEach(function(k){var x=obj(k);if(x)o[k]=JSON.parse(JSON.stringify(x));});return o;}
function applyRotate(orig,C,delta){Object.keys(orig).forEach(function(k){var o=orig[k],t=obj(k);if(!t)return;
  if(isZone(o)){t.pts=o.pts.map(function(q){var r=rot2({x:q[0],y:q[1]},C,delta);return [r1(r.x),r1(r.y)];});return;}
  if(isWall(o)){var a=rot2({x:o.x1,y:o.y1},C,delta),b=rot2({x:o.x2,y:o.y2},C,delta);t.x1=r1(a.x);t.y1=r1(a.y);t.x2=r1(b.x);t.y2=r1(b.y);}
  else{var c=rot2(center(o),C,delta);t.x=r1(c.x-o.w/2);t.y=r1(c.y-o.h/2);t.rot=norm((o.rot||0)+delta);}});}
function rotateSelection(delta){if(!sel.size)return;checkpoint();var list=Array.from(sel).map(obj).filter(Boolean),b=bbox(list);
  applyRotate(snapshotSel(),list.length===1&&!isWall(list[0])?center(list[0]):{x:b.cx,y:b.cy},delta);changed();}
function moveBy(orig,dx,dy,snap){Object.keys(orig).forEach(function(k){var o=orig[k],t=obj(k);if(!t)return;
  if(isZone(o)){var zx=snap?snapV(o.pts[0][0]+dx)-o.pts[0][0]:dx,zy=snap?snapV(o.pts[0][1]+dy)-o.pts[0][1]:dy;t.pts=o.pts.map(function(q){return [r1(q[0]+zx),r1(q[1]+zy)];});return;}
  if(isWall(o)){var ddx=snap?snapV(o.x1+dx)-o.x1:dx,ddy=snap?snapV(o.y1+dy)-o.y1:dy;t.x1=r1(o.x1+ddx);t.y1=r1(o.y1+ddy);t.x2=r1(o.x2+ddx);t.y2=r1(o.y2+ddy);}
  else{t.x=snap?snapV(o.x+dx):r1(o.x+dx);t.y=snap?snapV(o.y+dy):r1(o.y+dy);}});}
/* point d'accroche pour les murs : extrémités existantes, coins de salles, sinon grille */
function snapPt(p,skip){if(!$('snap').checked)return {x:r1(p.x),y:r1(p.y)};
  var best=null,bd=8/Math.max(zoom,.5)*1.2;
  S.walls.forEach(function(w){if(skip&&skip.id===w.id)return;[[w.x1,w.y1],[w.x2,w.y2]].forEach(function(q){if(skip&&skip.end&&false)return;var d=Math.hypot(q[0]-p.x,q[1]-p.y);if(d<bd){bd=d;best={x:q[0],y:q[1],anchor:true};}});});
  S.rooms.forEach(function(r){corners(r).forEach(function(q){var d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best={x:r1(q.x),y:r1(q.y),anchor:true};}});});
  S.zones.forEach(function(z){z.pts.forEach(function(q,i){if(skip&&skip.id===z.id&&skip.v===i)return;var d=Math.hypot(q[0]-p.x,q[1]-p.y);if(d<bd){bd=d;best={x:q[0],y:q[1],anchor:true};}});});
  return best||{x:snapV(p.x),y:snapV(p.y)};}
function angleSnap(a,p,free){if(free)return p;var dx=p.x-a.x,dy=p.y-a.y,L=Math.hypot(dx,dy),ang=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);
  return {x:r1(a.x+L*Math.cos(ang)),y:r1(a.y+L*Math.sin(ang))};}

function filteredRows(){
  var q=$('q').value.trim().toLowerCase(),rows;
  if(tblLayer==="desk"){var zf=$('zoneFilter').value,sf=$('statFilter').value,sdf=$('sdFilter').value;
    rows=S.desks.filter(function(d){if(zf&&zoneName(d)!==zf)return false;if(sf&&d.statut!==sf)return false;
      if(sdf!==""&&(!!d.assisDebout)!==(sdf==="1"))return false;var ergf=$('ergoFilter').value;if(ergf!==""&&(!!(d.ergo&&d.ergo.on))!==(ergf==="1"))return false;
      if(q&&(d.id+" "+zoneName(d)+" "+roomName(d)+" "+d.ilot+" "+d.occupant+" "+d.notes+" "+d.type).toLowerCase().indexOf(q)<0)return false;return true;});}
  else if(tblLayer==="storage"){rows=S.storages.filter(function(s){return !q||(s.id+" "+s.name+" "+s.modele+" "+s.notes+" "+s.drawers.map(function(d){return d.attr+" "+d.notes;}).join(" ")+" "+zoneName(s)+" "+roomName(s)).toLowerCase().indexOf(q)>=0;});}
  else if(tblLayer==="zone"){var ztf=$('zoneTypeFilter').value;rows=S.zones.filter(function(z){if(ztf&&z.type!==ztf)return false;
      if(q&&(z.id+" "+z.name+" "+z.type+" "+z.resp+" "+z.notes).toLowerCase().indexOf(q)<0)return false;return true;});}
  else{var tf=$('roomTypeFilter').value;rows=S.rooms.filter(function(r){if(tf&&r.type!==tf)return false;
      if(q&&(r.id+" "+r.name+" "+r.type+" "+r.notes).toLowerCase().indexOf(q)<0)return false;return true;});}
  rows.sort(function(a,b){var va,vb;
    if(sortKey.indexOf("eq:")===0){va=+a.equip[sortKey.slice(3)]||0;vb=+b.equip[sortKey.slice(3)]||0;return (va-vb)*sortDir;}
    if(sortKey==="capacite"){return ((+a.capacite||0)-(+b.capacite||0))*sortDir;}
    if(sortKey==="ergoOn"){return ((a.ergo&&a.ergo.on?1:0)-(b.ergo&&b.ergo.on?1:0))*sortDir;}
    if(sortKey==="ergoPour"){return String(a.ergo?a.ergo.pour:"").localeCompare(String(b.ergo?b.ergo.pour:""),'fr')*sortDir;}
    if(sortKey==="nDr"){return (a.drawers.length-b.drawers.length)*sortDir;}
    if(sortKey==="nAttr"){return (nAttr(a)-nAttr(b))*sortDir;}
    if(sortKey==="roomName"){return roomName(a).localeCompare(roomName(b),'fr',{numeric:true})*sortDir;}
    if(sortKey==="nDesks"){return (desksInRoom(a).length-desksInRoom(b).length)*sortDir;}
    if(sortKey==="zoneName"){return zoneName(a).localeCompare(zoneName(b),'fr',{numeric:true})*sortDir;}
    if(sortKey==="nPostes"){return (desksIn(a).length-desksIn(b).length)*sortDir;}
    if(sortKey==="assisDebout"){return ((a.assisDebout?1:0)-(b.assisDebout?1:0))*sortDir;}
    va=String(a[sortKey]==null?"":a[sortKey]);vb=String(b[sortKey]==null?"":b[sortKey]);return va.localeCompare(vb,'fr',{numeric:true})*sortDir;});
  return rows;
}

function clusterCells(c){var V=c.o==="v",w=V?26:52,h=V?52:26,W=w*c.cols,H=h*c.rows,cells=[],i,r,k;
  for(r=0;r<c.rows;r++)for(k=0;k<c.cols;k++)cells.push({x:k*w,y:r*h,w:w,h:h});
  [[c.cap1,-1],[c.cap2,1]].forEach(function(cp){var n=cp[0];if(!n)return;
    if(V){var tw=n*52,x0=(W-tw)/2,y0=cp[1]<0?-26:H;for(i=0;i<n;i++)cells.push({x:x0+i*52,y:y0,w:52,h:26});}
    else{var th=n*52,yy=(H-th)/2,xx=cp[1]<0?-26:W;for(i=0;i<n;i++)cells.push({x:xx,y:yy+i*52,w:26,h:52});}});
  var mx=Math.min.apply(null,cells.map(function(q){return q.x;})),my=Math.min.apply(null,cells.map(function(q){return q.y;}));
  cells.forEach(function(q){q.x=r1(q.x-mx);q.y=r1(q.y-my);});return cells;}

function rotAttr(o){return o.rot?' transform="rotate('+o.rot+" "+(o.x+o.w/2)+" "+(o.y+o.h/2)+')"':"";}

function staticSvg(){

  ZONES.forEach(function(z){if(!z.pts||z.pts.length<2)return;
    var xs=z.pts.map(function(q){return q[0];}),ys=z.pts.map(function(q){return q[1];}),x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs);
    var cx=(x0+x1)/2,cy=(Math.min.apply(0,ys)+Math.max.apply(0,ys))/2,nm=String(z.name||""),fs=Math.max(7,Math.min(14,(x1-x0)/(Math.max(6,nm.length)*0.62))),c=esc(z.color||"#3b82f6");

      '<text x="'+cx+'" y="'+(cy+fs*.35)+'" text-anchor="middle" font-size="'+fs+'" font-weight="700" fill="'+c+'" opacity=".85">'+esc(nm)+"</text>";});
  ROOMS.forEach(function(r){if(r.w==null)return;var cx=r.x+r.w/2,cy=r.y+r.h/2,nm=String(r.name||""),fs=Math.max(4.5,Math.min(12,r.h/3.6,(r.w-6)/(Math.max(4,nm.length)*0.58)));

      "<g"+(r.rot?' transform="rotate('+(-r.rot)+" "+cx+" "+cy+')"':"")+'><text x="'+cx+'" y="'+(cy-(r.capacite?fs*.6:0)+fs*.35)+'" text-anchor="middle" font-size="'+fs+'" font-weight="600" fill="#1d2330">'+esc(nm)+"</text>"+
      (r.capacite?'<text x="'+cx+'" y="'+(cy+fs*1.1)+'" text-anchor="middle" font-size="'+(fs*.85)+'" fill="#64748b">'+r.capacite+" pl.</text>":"")+"</g></g>";});

  COLS.forEach(function(c){h+='<rect x="'+(c[0]-12)+'" y="'+(c[1]-12)+'" width="24" height="24" fill="#1d2330"/>';});
  return h;}

function segHtml(){if(isAdm())return "";var oc=openReports();
  return '<div class="bx-chips" id="bxSeg"><button class="bx-dchip'+(adminTab==="emp"?" on":"")+'" data-t="emp">👥 Employés</button>'+

// --- 8.4 Employés + paramètres + sauvegarde ---
function renderEmployees(){
  var M=$("bxMain"),ed=editId?EMP[editId]:null,used={};activeEmployees().forEach(function(e){if(e.poste)used[e.poste]=e;});
  var unlinked=DESKS.filter(function(d){return d.occupant&&String(d.occupant).trim()&&!used[d.id];});
  var h=segHtml();
  if(unlinked.length)h+='<div class="bx-card" style="border-color:#fed7aa"><h3>Occupants de l\'inventaire non liés ('+unlinked.length+")</h3>"+unlinked.map(function(d){
    return '<div class="bx-li"><span><b>'+esc(d.occupant)+'</b> <span class="bx-mut bx-sm">poste '+esc(d.id)+'</span></span><span style="display:flex;gap:6px"><select class="bx-in" data-lk="'+esc(d.id)+'" style="width:auto;padding:5px"><option value="">Lier à…</option>'+
      activeEmployees().map(function(e){return '<option value="'+esc(e.id)+'">'+esc(fullname(e))+(e.poste?" ("+esc(e.poste)+")":"")+"</option>";}).join("")+
      '</select><button class="bx-btn sm" data-mk="'+esc(d.id)+'">Créer l\'employé</button></span></div>';}).join("")+'<p class="bx-mut bx-sm">« Lier à… » remplace le poste attitré de l\'employé choisi.</p></div>';
  var deskOpts='<option value="">— Aucun (postes partagés) —</option>'+DESKS.map(function(d){var u=used[d.id],mine=ed&&ed.poste===d.id;return '<option value="'+esc(d.id)+'"'+(mine?" selected":"")+">"+esc(d.id)+(u&&!mine?" — "+esc(fullname(u)):"")+"</option>";}).join("");
  function field(label,name,val){return "<div><label>"+label+'</label><input class="bx-in" name="'+name+'"'+(name==="prenom"?" required":"")+' value="'+esc(val||"")+'"></div>';}
  h+='<div class="bx-card"><h3>'+(ed?"Modifier "+esc(fullname(ed)):"Ajouter un employé")+'</h3><form id="bxF" class="bx-form">'+
    field("Prénom","prenom",ed&&ed.prenom)+field("Nom","nom",ed&&ed.nom)+field("Équipe","equipe",ed&&ed.equipe)+
    '<div><label>Poste attitré</label><select class="bx-in" name="poste">'+deskOpts+"</select></div>"+
    '<div style="grid-column:1/-1" class="bx-row"><button class="bx-btn" type="submit">'+(ed?"Enregistrer":"Ajouter")+"</button>"+(ed?'<button class="bx-btn sec" type="button" id="bxCancelEd">Annuler</button>':"")+"</div></form>"+
    '<p class="bx-mut bx-sm">Un poste attitré apparaît en gris sur le plan et n\'est réservable que par son titulaire. Commencez par les bureaux attribués ; l\'import Excel viendra ensuite.</p></div>';
  h+='<div class="bx-card"><h3>'+EMPLIST.length+' employé(s)</h3><div style="overflow-x:auto"><table class="bx-tbl"><thead><tr><th>Nom</th><th>Équipe</th><th>Poste</th><th>Actif</th><th></th></tr></thead><tbody>'+
    EMPLIST.map(function(e){return "<tr><td>"+esc(fullname(e))+"</td><td>"+esc(e.equipe||"")+"</td><td>"+esc(e.poste||"—")+'</td><td><input type="checkbox" data-act="'+esc(e.id)+'"'+(e.actif!==false?" checked":"")+'></td>'+
      '<td style="white-space:nowrap;text-align:right"><button class="bx-btn sec sm" data-ed="'+esc(e.id)+'">Modifier</button> <button class="bx-btn dng sm" data-del="'+esc(e.id)+'">'+(delArm===e.id?"Confirmer ?":"Retirer")+"</button></td></tr>";}).join("")+
    "</tbody></table></div>"+(EMPLIST.length?"":'<p class="bx-mut">Aucun employé pour l\'instant.</p>')+"</div>";
  h+='<div class="bx-card"><h3>Paramètres</h3><label class="bx-mut bx-sm">Conservation de l\'historique des présences (jours)</label><div class="bx-row"><input class="bx-in" id="bxRet" type="number" min="1" value="'+retention+'"><button class="bx-btn sm" id="bxRetS" style="flex:0 0 auto">Enregistrer</button></div>'+
    '<p class="bx-mut bx-sm">Les présences plus anciennes sont supprimées automatiquement quand l\'admin ouvre la page.</p></div>';
  h+='<div class="bx-card"><h3>Sauvegarde · version de l\'app '+APP_VERSION+'</h3><p class="bx-sm">Télécharge toute la base de données (inventaire, plan, employés, présences, signalements, paramètres) dans un fichier <b>sauvegarde-bureau-test-AAAAMMJJHHMMSS.json</b>, à ranger dans votre dossier de sauvegardes.</p><button class="bx-btn" id="bxBk">💾 Sauvegarde complète (JSON)</button></div>';
  M.innerHTML=wrap(h);bindSeg();
  $$(M,"[data-mk]",function(x){x.onclick=function(){var d=DMAP[x.dataset.mk];if(!d)return;var p=String(d.occupant).trim().split(/\s+/);
    write(function(){return db.doc("employees/"+uid("e")).set({prenom:p[0],nom:p.slice(1).join(" "),equipe:"",poste:d.id,actif:true,updatedAt:nowIso()});},p.join(" ")+" créé·e et lié·e à "+d.id);};});
  $$(M,"[data-lk]",function(x){x.onchange=function(){if(!x.value)return;write(function(){return db.doc("employees/"+x.value).update({poste:x.dataset.lk,updatedAt:nowIso()});},"Poste "+x.dataset.lk+" lié");};});
  $("bxF").onsubmit=function(ev){ev.preventDefault();var f=new FormData(this),prev=editId?EMP[editId]:null,id=editId||uid("e");
    var o={prenom:(f.get("prenom")||"").trim(),nom:(f.get("nom")||"").trim(),equipe:(f.get("equipe")||"").trim(),poste:f.get("poste")||"",actif:prev?prev.actif!==false:true,updatedAt:nowIso()};
    if(!o.prenom)return;var oldP=prev?prev.poste||"":"";
    write(function(){return db.doc("employees/"+id).set(o).then(function(){if(oldP!==o.poste)return syncDeskOccupant(oldP,o).catch(function(){});});},prev?"Employé modifié":"Employé ajouté",function(){editId=null;render();});};
  on("bxCancelEd",function(){editId=null;render();});
  $$(M,"[data-ed]",function(x){x.onclick=function(){editId=x.dataset.ed;render();$("bxMain").scrollTop=0;};});
  $$(M,"[data-del]",function(x){x.onclick=function(){var id=x.dataset.del;if(delArm!==id){delArm=id;render();return;}delArm=null;
    write(function(){return db.doc("employees/"+id).delete();},"Employé retiré",function(){if(editId===id)editId=null;});};});
  $$(M,"[data-act]",function(x){x.onchange=function(){write(function(){return db.doc("employees/"+x.dataset.act).update({actif:x.checked});},x.checked?"Activé":"Désactivé");};});
  on("bxBk",backup);
  on("bxRetS",function(){var n=parseInt($("bxRet").value,10);if(n>0)saveSettings({retentionDays:n},"Conservation : "+n+" jours",function(){retention=n;});});}

// Sauvegarde complète : toutes les collections → sauvegarde-bureau-test-AAAAMMJJHHMMSS.json
function backup(){if(busy||!db)return;busy=true;toast("Préparation de la sauvegarde…");
  var out={app:"Bureau Test (App Bureaux + Inventaire)",version:APP_VERSION,url:APP_URL,exportedAt:nowIso(),collections:{}};
  seq(BACKUP_COLLECTIONS.map(function(c){return function(){return db.collection(c).limit(1000).get().then(function(q){
    out.collections[c]=q.docs.filter(function(d){return d.id!=="seedlock";}).map(function(d){return {id:d.id,data:d.data()};});});};}))
  .then(function(){return window.claude.use("downloads");})
  .then(function(dl){if(!dl)throw {code:"nodl"};var n=0;Object.keys(out.collections).forEach(function(k){n+=out.collections[k].length;});out.count=n;
    return dl.save({filename:"sauvegarde-bureau-test-"+stamp()+".json",data:JSON.stringify(out,null,1)}).then(function(){done("Sauvegarde prête ("+n+" éléments)");});})
  .catch(function(e){busy=false;toast(e&&e.code==="nodl"?"Téléchargement indisponible dans cette vue — ouvrez la page sur claude.ai.":"Sauvegarde annulée ou impossible.");});}

// --- 8.5 Signalements ---
function renderReports(){
  var M=$("bxMain"),list=reps.filter(function(r){return repFilter==="all"||r.statut!=="resolu";});
  var h=segHtml()+'<div class="bx-card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Signalements</h3>'+
    '<select class="bx-in" id="bxRFil" style="width:auto;padding:5px"><option value="open"'+(repFilter==="open"?" selected":"")+'>À traiter</option><option value="all"'+(repFilter==="all"?" selected":"")+">Tous</option></select></div>"+
    (list.length?list.map(function(r){return '<div class="bx-li" style="align-items:flex-start"><span><b>'+esc(r.desk)+"</b> · "+esc(eqLabel(r.equip))+" · "+esc(REPORT_TYPE[r.type]||r.type)+
      '<br><span class="bx-sm">'+esc(r.comment||"")+'</span><br><span class="bx-mut bx-sm">'+esc(r.empName||"")+" · "+dshort(r.createdAt)+"</span></span>"+
      '<select class="bx-in" data-rs="'+esc(r.id)+'" style="width:auto;padding:5px">'+Object.keys(REPORT_STATUS).map(function(k){return '<option value="'+k+'"'+(r.statut===k?" selected":"")+">"+REPORT_STATUS[k][0]+"</option>";}).join("")+"</select></div>";}).join("")
     :'<p class="bx-mut">Aucun signalement '+(repFilter==="open"?"à traiter":"")+".</p>")+"</div>";
  M.innerHTML=wrap(h);bindSeg();
  $("bxRFil").onchange=function(){repFilter=this.value;render();};
  $$(M,"[data-rs]",function(x){x.onchange=function(){var o={statut:x.value,updatedAt:nowIso()};if(x.value==="resolu")o.resolvedAt=o.updatedAt;
    write(function(){return db.doc("reports/"+x.dataset.rs).update(o);},"Statut : "+REPORT_STATUS[x.value][0]);};});}

/* =============================== 9. ÉCRITURES ============================ */
// Réserver / déclarer : 1 poste par jour (verrou court sur le document), 1 place par employé et par jour
function book(deskId,date,statut){
  if(busy||!me||!db)return;busy=true;var ref=db.doc("bookings/"+date+"_"+deskId);
  Promise.resolve().then(function(){return ref.acquire({holder:"bx-"+me+"-"+Math.random().toString(36).slice(2),ttlMs:8000});})
  .catch(function(){return {acquired:true};})
  .then(function(r){if(!r.acquired)throw {code:"busy"};return ref.get();})
  .then(function(snap){var x=snap.exists?snap.data():null;if(x&&x.emp&&x.emp!==me)throw {code:"taken"};
    return db.collection("bookings").where("date","==",date).where("emp","==",me).get();})
  .then(function(q){return seq(q.docs.filter(function(d){return d.id!==ref.id;}).map(function(d){return function(){return db.doc("bookings/"+d.id).delete();};}));})
  .then(function(){return ref.set({date:date,desk:deskId,emp:me,empName:fullname(EMP[me]),statut:statut,createdAt:nowIso()});})
  .then(function(){done(statut==="reserve"?"Poste "+deskId+" réservé pour le "+lbl(date):"Présence enregistrée au poste "+deskId);if(view==="plan")openSheet();},fail);}
function confirmBooking(b){if(b)write(function(){return db.doc("bookings/"+b.id).update({statut:"confirme"});},"Présence confirmée — bonne journée !");}
function cancelBooking(b){if(b)write(function(){return db.doc("bookings/"+b.id).delete();},"Réservation annulée");}
// Attribuer un poste (empId vide = libérer) : met à jour l'employé ET l'occupant du poste dans l'inventaire
function assignDesk(deskId,empId){var em=empId?EMP[empId]:null,now=nowIso(),ops=[];
  EMPLIST.forEach(function(x){if(x.poste===deskId&&x.id!==empId)ops.push(function(){return db.doc("employees/"+x.id).update({poste:"",updatedAt:now});});});
  if(em&&em.poste&&em.poste!==deskId&&DMAP[em.poste])ops.push(function(){return db.doc("desks/"+em.poste).update({occupant:""});});
  if(em)ops.push(function(){return db.doc("employees/"+empId).update({poste:deskId,updatedAt:now});});
  if(DMAP[deskId])ops.push(function(){var o={occupant:em?fullname(em):""};if(em)o.statut="Attribué";return db.doc("desks/"+deskId).update(o);});
  write(function(){return seq(ops);},em?"Poste "+deskId+" attribué à "+fullname(em):"Poste "+deskId+" libéré");}
// Fiche employé modifiée : vide l'ancien poste, renseigne le nouveau
function syncDeskOccupant(oldP,emp){var q=[];
  if(oldP&&DMAP[oldP])q.push(function(){return db.doc("desks/"+oldP).update({occupant:""});});
  if(emp.poste&&DMAP[emp.poste])q.push(function(){return db.doc("desks/"+emp.poste).update({occupant:fullname(emp),statut:"Attribué"});});
  return seq(q);}
function markInventoried(id,yes){write(function(){return db.doc("desks/"+id).update({inv:yes?{d:today(),by:adminName()}:null});},yes?"Poste "+id+" inventorié":"Inventaire du poste annulé");}
// settings/main est réécrit en entier (une valeur undefined retire la clé)
function saveSettings(patch,msg,after){var o=Object.assign({},SET,patch);Object.keys(o).forEach(function(k){if(o[k]===undefined)delete o[k];});
  write(function(){return db.doc("settings/main").set(o);},msg,after);}

/* ======================= 10. ABONNEMENTS AUX DONNÉES ====================== */
function rows(s){return s.docs.map(function(x){return Object.assign({id:x.id},x.data());});}
function subInventory(){
  db.doc("app/config").onSnapshot(function(s){var c=s.exists?s.data():null;if(!c)return;
    if(c.equipment)EQ=c.equipment;if(c.types)TYPES=c.types;if(c.inv)INVC=c.inv;
    if(c.planW&&c.planH&&(c.planW!==W||c.planH!==H)){W=c.planW;H=c.planH;}
    if(c.columns)COLS=c.columns;rebuildPlan();},function(){});
  function layer(name,set){db.collection(name).onSnapshot(function(s){if(s.metadata.fromCache&&!s.docs.length)return;set(s.docs.map(function(x){return x.data();}));rebuildPlan();},function(){});}
  layer("rooms",function(v){ROOMS=v;});layer("storages",function(v){STORS=v;});layer("walls",function(v){WALLS=v;});layer("zones",function(v){ZONES=v;});
  layer("desks",function(v){if(v.length)setDesks(v);});
  db.doc("settings/main").onSnapshot(function(s){SET=s.exists?Object.assign({},s.data()):{};if(SET.retentionDays>0)retention=SET.retentionDays;if(view==="plan"&&isAdm())refreshInvCard();},function(){});}
function subEmployees(){var to=setTimeout(function(){if(!empLoaded){empLoaded=true;toast("Données lentes à charger — elles peuvent être incomplètes.");render();}},10000);
  db.collection("employees").onSnapshot(function(s){EMP={};rows(s).forEach(function(e){EMP[e.id]=e;});
    EMPLIST=Object.keys(EMP).map(function(k){return EMP[k];}).sort(byName);
    if(!s.metadata.fromCache){clearTimeout(to);empLoaded=true;if(me&&!EMP[me]){me=null;lsSet(LS_ME,null);}}else if(EMPLIST.length)empLoaded=true;
    if(view==="plan"){updatePlan();if(selDesk)openSheet();}else render();},function(){empLoaded=true;render();});}
function subDay(){if(unsub.day)unsub.day();dayBk={};if(!db)return;var d=selDate;
  unsub.day=db.collection("bookings").where("date","==",d).onSnapshot(function(s){if(d!==selDate)return;dayBk={};
    rows(s).forEach(function(b){if(b.emp&&b.desk)dayBk[b.desk]=b;});updatePlan();if(view==="plan"&&selDesk)openSheet();},function(){});}
function subMine(){if(unsub.mine)unsub.mine();myBk=[];allMine=[];subMyReports();if(!db||!me)return;var m=me;
  unsub.mine=db.collection("bookings").where("emp","==",m).onSnapshot(function(s){if(m!==me)return;var t=today();
    allMine=rows(s).filter(function(b){return b.desk;}).sort(function(a,b){return a.date<b.date?-1:1;});
    myBk=allMine.filter(function(b){return b.date>=t;});if(view==="home"||view==="hist"||view==="poste")render();},function(){});}
function sortReports(s){return rows(s).filter(function(r){return r.desk;}).sort(function(a,b){return (b.createdAt||"").localeCompare(a.createdAt||"");});}
function subReports(){if(unsub.reps)unsub.reps();unsub.reps=db.collection("reports").onSnapshot(function(s){reps=sortReports(s);if(view==="admin")render();else nav();},function(){});}
function subMyReports(){if(unsub.myReps)unsub.myReps();myReps=[];if(!db||!me)return;var m=me;
  unsub.myReps=db.collection("reports").where("emp","==",m).onSnapshot(function(s){if(m!==me)return;myReps=sortReports(s);if(view==="poste")render();},function(){});}
// Supprime les présences plus anciennes que la durée de conservation (admin seulement)
function purgeOldBookings(){db.doc("settings/main").get().then(function(s){var v=s.exists?s.data():null;if(v&&v.retentionDays>0)retention=v.retentionDays;
  var c=new Date();c.setDate(c.getDate()-retention);
  return db.collection("bookings").where("date","<",iso(c)).limit(200).get().then(function(q){return seq(q.docs.map(function(d){return function(){return db.doc("bookings/"+d.id).delete();};}));});}).catch(function(){});}

/* =============================== 11. DÉMARRAGE ============================ */
function start(){ready=true;subEmployees();try{subInventory();}catch(e){}subDay();subMine();if(isOwner){purgeOldBookings();subReports();}render();}
function boot(){
  if(!(window.claude&&typeof window.claude.use==="function")){fatal("Ouvrez cette page sur claude.ai (connecté·e) pour utiliser Mon bureau.");return;}
  var to=setTimeout(function(){if(!ready)fatal("La base de données ne répond pas pour le moment. Réessayez dans quelques minutes.");},12000);
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){db=r[0];user=r[1];clearTimeout(to);
    if(!db){fatal("Connectez-vous à claude.ai pour utiliser Mon bureau.");return;}
    return Promise.resolve().then(function(){return user&&user.isOwner?user.isOwner():false;}).catch(function(){return false;}).then(function(o){isOwner=!!o;start();});})
  .catch(function(){clearTimeout(to);fatal("Mon bureau est indisponible dans cette vue.");});}
function mount(){document.body.appendChild(root);document.body.appendChild(back);
  back.onclick=function(){back.hidden=true;root.hidden=false;go("home");};
  $("bxWho").onclick=function(){go("pick");};
  $("bxRole").onclick=function(){setRole(role==="admin"?"emp":"admin");closeSheet();go(role==="admin"?"aemp":"home");toast(role==="admin"?"Vue admin":"Vue employé");};
  render();boot();}
if(document.body)mount();else document.addEventListener("DOMContentLoaded",mount);
})();
</script>
